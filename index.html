<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============================================================
   0. GOLDEN FIREFLIES
   ============================================================ */
function makeFireflies(canvasId, amount, opacity) {
  const canvas = $(canvasId);
  if (!canvas) return { stop() {} };
  const ctx = canvas.getContext('2d');

  let w = 0, h = 0, particles = [], running = true, raf = 0;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    particles = Array.from({ length: amount }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: .7 + Math.random() * 1.5,
      phase: Math.random() * Math.PI * 2,
      speed: .12 + Math.random() * .38,
      drift: (Math.random() - .5) * .22,
      alpha: .2 + Math.random() * .55
    }));
  }

  function draw() {
    if (!running) return;
    ctx.clearRect(0, 0, w, h);
    const time = performance.now() * .001;

    particles.forEach(p => {
      p.y -= p.speed * .22;
      p.x += p.drift;
      if (p.y < -8) { p.y = h + 8; p.x = Math.random() * w; }
      if (p.x < -8) p.x = w + 8;
      if (p.x > w + 8) p.x = -8;

      const pulse = .35 + .65 * (Math.sin(time * 1.3 + p.phase) * .5 + .5);
      const alpha = p.alpha * pulse * opacity;

      const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 7);
      glow.addColorStop(0, `rgba(255,220,151,${alpha})`);
      glow.addColorStop(1, 'rgba(255,197,112,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 7, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = `rgba(255,232,184,${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });

    if (!reduceMotion) raf = requestAnimationFrame(draw);
  }

  resize();
  if (!reduceMotion) draw();

  let lastW = window.innerWidth;
  window.addEventListener('resize', () => {
    if (Math.abs(window.innerWidth - lastW) > 40) {
      lastW = window.innerWidth;
      resize();
    }
  });

  return {
    stop() { running = false; cancelAnimationFrame(raf); }
  };
}

const openingFx = makeFireflies('openingFireflies', window.innerWidth < 600 ? 24 : 42, .8);
makeFireflies('siteFireflies', window.innerWidth < 600 ? 18 : 32, .45);


/* ============================================================
   1. ENVELOPE OPENING
   ============================================================ */
const envelope    = $('envelope');
const inviteModal = $('inviteModal');
const opening     = $('opening');
const site        = $('site');
const enterSite   = $('enterSite');

$('openSeal').addEventListener('click', () => {
  envelope.classList.add('open');

  setTimeout(() => {
    inviteModal.classList.add('show');
    setupScratch();
  }, 650);
});

function enterInvitation() {
  inviteModal.classList.remove('show');
  opening.classList.add('dismissed');
  document.body.classList.remove('locked');
  site.classList.add('ready');
  window.scrollTo(0, 0);
  updateScrollProgress();
  setTimeout(() => openingFx.stop(), 1100);
}

enterSite.addEventListener('click', enterInvitation);
$('skipScratch').addEventListener('click', () => revealScratch());


/* ============================================================
   2. SCRATCH TO REVEAL
   ============================================================ */
const scratchCanvas = $('scratchCanvas');
const scratchWrap   = $('scratchWrap');
const scratchHelp   = $('scratchHelp');
const scratchCtx    = scratchCanvas.getContext('2d', { willReadFrequently: true });

let scratching = false;
let scratchCleared = false;
let strokes = 0;
let lastPoint = null;
let cssW = 0, cssH = 0;

function setupScratch() {
  if (scratchCleared) return;

  cssW = scratchWrap.clientWidth;
  cssH = scratchWrap.clientHeight;
  if (!cssW || !cssH) return;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  scratchCanvas.width  = Math.round(cssW * dpr);
  scratchCanvas.height = Math.round(cssH * dpr);
  scratchCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const gradient = scratchCtx.createLinearGradient(0, 0, cssW, cssH);
  gradient.addColorStop(0, '#d8c08d');
  gradient.addColorStop(.45, '#f1dfb5');
  gradient.addColorStop(1, '#b9955d');

  scratchCtx.globalCompositeOperation = 'source-over';
  scratchCtx.fillStyle = gradient;
  scratchCtx.fillRect(0, 0, cssW, cssH);

  scratchCtx.strokeStyle = 'rgba(255,250,230,.45)';
  scratchCtx.lineWidth = 1;
  for (let x = -cssH; x < cssW + cssH; x += 13) {
    scratchCtx.beginPath();
    scratchCtx.moveTo(x, 0);
    scratchCtx.lineTo(x + cssH, cssH);
    scratchCtx.stroke();
  }

  scratchCtx.fillStyle = 'rgba(89,63,34,.72)';
  scratchCtx.font = '600 10px Manrope,Arial,sans-serif';
  scratchCtx.textAlign = 'center';
  scratchCtx.fillText('SCRATCH HERE  ✧  SCRATCH HERE', cssW / 2, cssH / 2 + 4);

  scratchCtx.globalCompositeOperation = 'destination-out';
  scratchCtx.lineCap = 'round';
  scratchCtx.lineJoin = 'round';
  scratchCtx.lineWidth = 46;
}

function scratchPoint(event) {
  const rect = scratchCanvas.getBoundingClientRect();
  return {
    x: (event.clientX - rect.left) * (cssW / rect.width),
    y: (event.clientY - rect.top)  * (cssH / rect.height)
  };
}

function scratchAt(event) {
  if (!scratching || scratchCleared) return;

  const p = scratchPoint(event);

  if (lastPoint) {
    scratchCtx.beginPath();
    scratchCtx.moveTo(lastPoint.x, lastPoint.y);
    scratchCtx.lineTo(p.x, p.y);
    scratchCtx.stroke();
  } else {
    scratchCtx.beginPath();
    scratchCtx.arc(p.x, p.y, 23, 0, Math.PI * 2);
    scratchCtx.fill();
  }
  lastPoint = p;

  if (++strokes % 6 === 0) checkScratch();
}

function checkScratch() {
  try {
    const data = scratchCtx.getImageData(0, 0, scratchCanvas.width, scratchCanvas.height).data;
    let transparent = 0, total = 0;

    for (let i = 3; i < data.length; i += 36) {
      total++;
      if (data[i] < 100) transparent++;
    }

    if (total && transparent / total > .34) revealScratch();
  } catch (e) {
    // "Reveal without scratching" still works if sampling is blocked.
  }
}

function revealScratch() {
  if (scratchCleared) return;
  scratchCleared = true;
  scratching = false;

  scratchCanvas.classList.add('cleared');
  scratchHelp.textContent = 'The date is revealed — we hope to celebrate with you.';
  $('skipScratch').style.display = 'none';
  enterSite.disabled = false;
  enterSite.focus({ preventScroll: true });
}

scratchCanvas.addEventListener('pointerdown', event => {
  if (scratchCleared) return;
  event.preventDefault();
  scratching = true;
  lastPoint = null;
  scratchCanvas.setPointerCapture(event.pointerId);
  scratchAt(event);
});

scratchCanvas.addEventListener('pointermove', scratchAt);

['pointerup', 'pointercancel', 'lostpointercapture'].forEach(type => {
  scratchCanvas.addEventListener(type, () => {
    scratching = false;
    lastPoint = null;
  });
});

window.addEventListener('resize', () => {
  if (scratchCleared || !inviteModal.classList.contains('show')) return;
  if (Math.abs(scratchWrap.clientWidth - cssW) > 2) setupScratch();
});


/* ============================================================
   3. WEDDING COUNTDOWN — 29 JANUARY 2027, 7:00 PM IST
   ============================================================ */
const weddingDate = new Date('2027-01-29T19:00:00+05:30').getTime();
const countdownEl = $('countdown');
const cdDays = $('days'), cdHours = $('hours'), cdMinutes = $('minutes'), cdSeconds = $('seconds');
let countdownTimer = null;

function updateCountdown() {
  const remaining = weddingDate - Date.now();

  if (remaining <= 0) {
    countdownEl.innerHTML =
      '<div class="countdown-item"><strong>Today</strong><span>Our wedding day</span></div>';
    clearInterval(countdownTimer);
    return;
  }

  cdDays.textContent    = Math.floor(remaining / 86400000);
  cdHours.textContent   = String(Math.floor((remaining % 86400000) / 3600000)).padStart(2, '0');
  cdMinutes.textContent = String(Math.floor((remaining % 3600000) / 60000)).padStart(2, '0');
  cdSeconds.textContent = String(Math.floor((remaining % 60000) / 1000)).padStart(2, '0');
}

updateCountdown();
countdownTimer = setInterval(updateCountdown, 1000);


/* ============================================================
   4. SCROLL REVEAL ANIMATIONS
   ============================================================ */
const revealEls = document.querySelectorAll('.reveal');

if ('IntersectionObserver' in window) {
  const observer = new IntersectionObserver((entries, obs) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        obs.unobserve(entry.target);
      }
    });
  }, { threshold: .13 });

  revealEls.forEach(el => observer.observe(el));
} else {
  revealEls.forEach(el => el.classList.add('visible'));
}

   5. MOBILE NAVIGATION
   ============================================================ */
const menuToggle = $('menuToggle');
const navLinks   = $('navLinks');

function closeMenu() {
  navLinks.classList.remove('open');
  menuToggle.setAttribute('aria-expanded', 'false');
